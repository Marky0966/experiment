<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title> Class Chat · G11 STEM ITIS A1</title></head><body><main></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js"></script><script>boot('chat.html',m=>{
m.innerHTML='<h1>💬 Class Chat</h1><p style="color:var(--mute)">Everyone who is logged in can chat here.</p><div id="nk" class="card"><p>Choose a nickname before you chat.</p><div class="row"><input id="nn" placeholder="Nickname" maxlength="20"><button onclick="setNick()">Continue</button></div></div><div id="box" hidden><div id="msgs"></div><div class="row" style="margin-top:8px"><input id="mt" placeholder="Type a message…" onkeydown="if(event.key==\'Enter\')send()"><button onclick="send()">Send</button></div></div>';
let nick=localStorage.getItem('nick:'+(me().email||me().name))||'';const key=me().email||me().name;
window.setNick=()=>{if(!nn.value.trim())return;nick=nn.value.trim();localStorage.setItem('nick:'+key,nick);go()};
window.send=()=>{if(!mt.value.trim())return;S.add('chat',{n:nick,k:key,x:mt.value.trim(),t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});mt.value=''};
function go(){nk.hidden=true;box.hidden=false;S.watch('chat',C=>{msgs.innerHTML=C.slice(-200).map(x=>`<div class="m ${x.k==key?'mine':''}"><b>${esc(x.n)}</b><small>${x.t}</small><br>${esc(x.x)}</div>`).join('')||'<p style="color:var(--mute)">No messages yet. Say hi!</p>';msgs.scrollTop=1e9})}
if(nick)go()})</script></body></html>
