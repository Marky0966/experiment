<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title> G11 STEM ITIS A1</title></head><body><main></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js"></script><script>boot('index.html',m=>{
m.innerHTML=`<div class="hero"><h1>Hello, ${esc(me().name.split(' ')[0])}!</h1><p>Pick a subject, choose a term, and review together.</p></div>
<div class="grid"><div class="card stat"><b id="a">0</b>Subjects</div><div class="card stat"><b id="b">0</b>Lessons posted</div><div class="card stat"><b>3</b>Terms</div></div>
<h2 style="margin-top:24px">🔔 Review Alerts</h2><div id="al"></div>
<h2 style="margin-top:24px">Start here</h2><div class="grid">${TERMS.map((t,i)=>`<a class="card term t${i}" href="subjects.html"><span class="chip">Step ${i+1}</span><h3>${t}</h3><small>Open subjects →</small></a>`).join('')}</div>
<h2 style="margin-top:24px">🆕 Latest lessons</h2><div id="lt"></div>`;
a.textContent=SUBJECTS.length;
S.watch('alerts',A=>{al.innerHTML=(A.length?A.slice().reverse().map(x=>x.x):['Review your Term 1 notes before the next quiz.','Check new lessons posted by your classmates.']).map(x=>`<div class="alert">⏰ ${esc(x)}</div>`).join('')});
S.watch('lessons',L=>{L=L.filter(l=>l.ok);b.textContent=L.length;lt.innerHTML=L.length?L.slice(-3).reverse().map(l=>`<div class="card" style="margin:8px 0"><span class="chip">${esc(l.s)} · ${esc(l.t)}</span><h3>${esc(l.ti)}</h3></div>`).join(''):'<div class="alert">No lessons yet. Open a subject and post the first one!</div>'})})</script></body></html>
