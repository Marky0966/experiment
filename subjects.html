<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title> Subjects · G11 STEM ITIS A1</title></head><body><main></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js"></script><script>boot('subjects.html',m=>{
m.innerHTML='<h1>📚 Subjects</h1><p style="color:var(--mute)">Each subject has Term 1, Term 2 and Term 3 sections.</p><input id="q" placeholder="🔍 Search subjects"><div class="grid" id="g"></div>';
let C={};const draw=()=>{g.innerHTML=SUBJECTS.map((s,i)=>({s,i})).filter(x=>x.s.n.toLowerCase().includes(q.value.toLowerCase())).map(({s,i})=>`<a class="card subj" style="--c:${s.c}" href="subject.html?i=${i}"><div class="ic">${s.i}</div><h3>${esc(s.n)}</h3><span class="chip">${C[s.n]||0} lessons</span></a>`).join('')};
q.oninput=draw;draw();S.watch('lessons',L=>{C={};L.filter(l=>l.ok).forEach(l=>C[l.s]=(C[l.s]||0)+1);draw()})})</script></body></html>
