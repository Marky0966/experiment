<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title> Owner Panel · G11 STEM ITIS A1</title></head><body><main></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="app.js"></script><script>boot('admin.html',m=>{
if(!isOwner()){location.href='index.html';return}
m.innerHTML='<h1>🛡️ Owner Panel</h1><h2>Waiting for approval</h2><div id="p"></div><h2 style="margin-top:24px">Post a review alert</h2><div class="row"><input id="an" placeholder="e.g. Review Term 2 Math before Friday"><button onclick="addA()">Post</button></div><h2 style="margin-top:24px">Who logged in</h2><div class="card"><table id="lg"></table></div>';
S.watch('lessons',L=>{const w=L.filter(l=>!l.ok);p.innerHTML=w.length?w.map(l=>`<div class="card" style="margin:8px 0"><span class="chip">${esc(l.s)} · ${esc(l.t)}</span><h3>${esc(l.ti)}</h3><small>by ${esc(l.by)}</small><p>${esc(l.tx)}</p>${l.im?`<img class="n" src="${l.im}" width="160">`:''}<button class="ok" onclick="S.upd('lessons','${l.id}',{ok:true})">Approve</button> <button class="no" onclick="S.del('lessons','${l.id}')">Reject</button></div>`).join(''):'<div class="alert">Nothing waiting. 🎉</div>'});
S.watch('logins',L=>{lg.innerHTML='<tr><th>Name</th><th>Gmail</th><th>Time</th></tr>'+L.slice().reverse().map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.at)}</td></tr>`).join('')});
window.addA=()=>{if(!an.value.trim())return;S.add('alerts',{x:an.value.trim()}).then(()=>{an.value='';alert('Alert posted!')})}})</script></body></html>
